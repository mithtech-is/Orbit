# Separate ERPNext + Frappe CRM instance for Orbit/Orbit lead capture.
#
# This is an ISOLATED Compose project — it does NOT touch the existing
# `frappe-hr-v16` (ERPNext HR, port 8080) instance:
#   - distinct project name `routepilot-crm`  -> separate network + volumes
#   - distinct host port 8082                  -> no clash with 8080
#   - own MariaDB + Redis (internal only)      -> no shared DB/cache
#
# Site:    crm.localhost   (access at http://localhost:8082)
# Apps:    erpnext (at create-site) + crm (added at runtime via bench get-app)
#
# The `crm` app is installed onto the SHARED `apps` volume at runtime and made
# importable in every container via PYTHONPATH — the same pattern the existing
# hr.yml uses for hrms/education (no custom image build required).
#
# Bring up:   docker compose -f infra/erpnext-crm/crm.yml up -d
# (then run the CRM install steps documented in infra/erpnext-crm/README.md)
name: routepilot-crm

x-pythonpath: &pythonpath /home/frappe/frappe-bench/apps/crm

services:
  backend:
    image: frappe/erpnext:v16
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs
    environment:
      PYTHONPATH: *pythonpath
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin

  configurator:
    image: frappe/erpnext:v16
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      PYTHONPATH: *pythonpath
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:v16
    environment:
      PYTHONPATH: *pythonpath
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --set-default crm.localhost;

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: frappe/erpnext:v16
    networks:
      - frappe_network
    depends_on:
      - websocket
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      PYTHONPATH: *pythonpath
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: crm.localhost
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8082:8080"

  queue-long:
    image: frappe/erpnext:v16
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs
    environment:
      PYTHONPATH: *pythonpath
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  queue-short:
    image: frappe/erpnext:v16
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs
    environment:
      PYTHONPATH: *pythonpath
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    image: frappe/erpnext:v16
    environment:
      PYTHONPATH: *pythonpath
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    image: frappe/erpnext:v16
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      PYTHONPATH: *pythonpath
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/assets
      - apps:/home/frappe/frappe-bench/apps
      - logs:/home/frappe/frappe-bench/logs

volumes:
  db-data:
  apps:
  assets:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
